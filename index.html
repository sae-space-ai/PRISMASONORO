<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PRISMA SONORO — Transcripción musical de audio a partitura. Cada sonido, en su lugar." />
    <meta name="author" content="Prof. Manuel Gago Fernández" />
    <title>PRISMA SONORO — Cada sonido, en su lugar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #080D18; }
      #root { width: 100%; height: 100%; }
      /* Splash screen */
      .splash {
        position: fixed; inset: 0;
        background: #080D18;
        display: flex; align-items: center; justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s;
      }
      .splash.hidden { opacity: 0; pointer-events: none; }
      .splash-logo {
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        font-size: 32px;
        letter-spacing: 0.1em;
        background: linear-gradient(135deg, #6366F1, #8B5CF6, #F58BDD);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .splash-sub {
        font-family: 'Inter', sans-serif;
        font-size: 12px;
        color: #AAB8CE;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="splash" id="splash">
      <div style="text-align: center;">
        <div class="splash-logo">PRISMA SONORO</div>
        <div class="splash-sub">Cada sonido, en su lugar</div>
      </div>
    </div>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('splash');
          if (splash) splash.classList.add('hidden');
          setTimeout(() => splash?.remove(), 500);
        }, 300);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
